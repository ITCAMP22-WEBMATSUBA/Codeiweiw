<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    button{
            margin: 5px;
            padding: 5px;
            padding-top: 5px;
        }

        .container1{
            display: flex;
            justify-content: center;
        }
         .container2{
            background-color: blue;
            display: grid;
            grid-template-columns:  1fr 1fr 1fr;
            grid-template-rows: 1fr 2fr 1fr;
           grid-row-gap:10px ;
            grid-column-gap:10px ;
            grid-gap: 10px;
        }

    </style>
</head>
<body>
    <!-- padding -->
    <button>Btn1</button>
    <button>Btn2</button>

    <!-- div -->
     <div class="container1">
        <button>Btn1</button>
        <button>Btn2</button>
        <button>Btn3</button>
        <button>Btn4</button>
     </div>


     <div class="container2">
        <button>Btn1</button>
        <button>Btn2</button>
        <button>Btn3</button>
        <button>Btn4</button>
        <button>Btn5</button>
        <button>Btn6</button>
        <button>Btn7</button>
        <button>Btn8</button>
        <button>Btn9</button>
     </div>


</body>
</html>
